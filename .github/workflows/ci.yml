name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck without cache
        run: bun run typecheck:ci

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.15
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install website test browser
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Test workspaces
        run: bun run test
      - name: Test Oxlint plugins
        run: bun run test:tools

  package:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.15
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Validate Cloudflare website deployment
        run: node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config apps/website/wrangler.jsonc
      - name: Build and validate CLI tarball
        run: bun run --cwd packages/cli pack:smoke --output "${{ runner.temp }}/package"
      - name: Upload validated CLI tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aerograph-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 1

  minimum-runtime:
    name: Bun minimum runtime
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out runtime smoke test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up minimum supported Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.1.38
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Download validated CLI tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aerograph-package
          path: ${{ runner.temp }}/package
      - name: Test installed CLI on minimum Bun
        run: bun run packages/cli/scripts/runtime-smoke.ts bun "${{ runner.temp }}"/package/*.tgz
      - name: Test Bun package install without Node or npm
        run: bun run packages/cli/scripts/bun-only-smoke.ts "${{ runner.temp }}"/package/*.tgz

  node-runtime:
    name: Node.js ${{ matrix.node-version }} runtime
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - name: Check out runtime smoke test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.15
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download validated CLI tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aerograph-package
          path: ${{ runner.temp }}/package
      - name: Test installed CLI on Node.js
        run: bun run packages/cli/scripts/runtime-smoke.ts node "${{ runner.temp }}"/package/*.tgz
      - name: Test existing graph upgrades across Node.js and Bun
        if: matrix.node-version == 24
        run: bun run packages/cli/scripts/runtime-upgrade-smoke.ts "${{ runner.temp }}"/package/*.tgz

  deploy-website:
    name: Deploy production website
    needs: [quality, tests, package, minimum-runtime, node-runtime]
    if: github.repository == 'HunterEvangelista/AeroGraph' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: website-production
      url: https://aerograph.dev
    concurrency:
      group: website-production
      # Cancelling a client cannot reliably cancel a publish already accepted by Cloudflare.
      cancel-in-progress: false
    steps:
      - name: Check out tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.15
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build website from tested revision
        run: bun run --cwd apps/website build
      - name: Publish current main revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          node apps/website/scripts/deploy-policy.mjs
          node node_modules/wrangler/bin/wrangler.js deploy \
            --config apps/website/wrangler.jsonc \
            --message "Commit $GITHUB_SHA | CI $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          {
            echo '## Production website published'
            echo "- Website: https://aerograph.dev"
            echo "- Tested commit: $GITHUB_SHA"
            echo "- CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '- Cloudflare version ID: see the publish step output and Worker deployment history.'
            echo '- Verify public DNS, TLS, routes, and assets using apps/website/README.md.'
          } >> "$GITHUB_STEP_SUMMARY"
